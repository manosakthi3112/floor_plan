<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" style="background:#ffffff;">
  <!-- Outer Frame & Grid -->
  <rect x="0" y="0" width="800" height="800" fill="#ffffff"/>
  
  <!-- Exterior Walls (Thick Black) -->
  <rect x="100" y="100" width="600" height="15" fill="#000000"/>
  <rect x="100" y="100" width="15" height="600" fill="#000000"/>
  <rect x="700" y="100" width="15" height="300" fill="#000000"/>
  <rect x="700" y="400" width="50" height="15" fill="#000000"/>
  <rect x="750" y="400" width="15" height="300" fill="#000000"/>
  <rect x="100" y="700" width="665" height="15" fill="#000000"/>

  <!-- Interior Partitions -->
  <rect x="100" y="450" width="400" height="10" fill="#000000"/>
  <rect x="500" y="100" width="10" height="350" fill="#000000"/>
  <rect x="350" y="450" width="10" height="250" fill="#000000"/>
  <rect x="550" y="450" width="10" height="250" fill="#000000"/>
  <rect x="550" y="450" width="200" height="10" fill="#000000"/>

  <!-- Room Text Labels -->
  <text x="250" y="270" font-family="sans-serif" font-size="16" font-weight="bold" fill="#666666" text-anchor="middle">LIVING ROOM</text>
  <text x="610" y="250" font-family="sans-serif" font-size="16" font-weight="bold" fill="#666666" text-anchor="middle">KITCHEN</text>
  <text x="225" y="585" font-family="sans-serif" font-size="16" font-weight="bold" fill="#666666" text-anchor="middle">BEDROOM</text>
  <text x="450" y="585" font-family="sans-serif" font-size="14" font-weight="bold" fill="#666666" text-anchor="middle">HALL</text>
  <text x="650" y="585" font-family="sans-serif" font-size="16" font-weight="bold" fill="#666666" text-anchor="middle">BATHROOM</text>
  <text x="685" y="430" font-family="sans-serif" font-size="12" font-weight="bold" fill="#666666" text-anchor="middle">HALL</text>

  <!-- Door Swings & Openings -->
  <!-- Main Entrance -->
  <path d="M 450 700 A 70 70 0 0 1 520 630" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="450" y1="700" x2="450" y2="630" stroke="#000000" stroke-width="2"/>
  <polygon points="450,725 442,740 458,740" fill="#000000"/>

  <!-- Bedroom Door -->
  <path d="M 350 500 A 60 60 0 0 0 410 500" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Bathroom Door -->
  <path d="M 550 500 A 60 60 0 0 1 490 500" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Furniture Representations -->
  <!-- Living Room Sofa -->
  <rect x="125" y="200" width="30" height="120" rx="4" fill="none" stroke="#888888" stroke-width="1.5"/>
  <rect x="220" y="140" width="80" height="30" rx="4" fill="none" stroke="#888888" stroke-width="1.5"/>

  <!-- Dining Table -->
  <rect x="540" y="220" width="60" height="80" rx="6" fill="none" stroke="#888888" stroke-width="1.5"/>
  <circle cx="525" cy="240" r="10" fill="none" stroke="#888888" stroke-width="1.5"/>
  <circle cx="525" cy="280" r="10" fill="none" stroke="#888888" stroke-width="1.5"/>
  <circle cx="615" cy="240" r="10" fill="none" stroke="#888888" stroke-width="1.5"/>
  <circle cx="615" cy="280" r="10" fill="none" stroke="#888888" stroke-width="1.5"/>

  <!-- Bedroom Bed -->
  <rect x="180" y="600" width="100" height="90" rx="4" fill="none" stroke="#888888" stroke-width="1.5"/>
  <rect x="190" y="605" width="35" height="20" rx="2" fill="none" stroke="#888888" stroke-width="1"/>
  <rect x="235" y="605" width="35" height="20" rx="2" fill="none" stroke="#888888" stroke-width="1"/>

  <!-- Bathroom Bathtub -->
  <rect x="570" y="640" width="160" height="50" rx="12" fill="none" stroke="#888888" stroke-width="1.5"/>
</svg>
